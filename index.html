<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea tu Canción Personalizada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { height: 100dvh; overflow: hidden; background-color: #f8fafc; }
        #chat-container { scroll-behavior: smooth; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="h-[100dvh] flex flex-col justify-between overflow-hidden font-sans">

    <!-- Header Estilizado y Moderno -->
    <header class="bg-indigo-950 text-white px-6 py-4 flex justify-between items-center shadow-md z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-indigo-600 flex items-center justify-center text-xl shadow-inner">🎶</div>
            <div>
                <h1 class="text-base font-bold tracking-tight">Tu Canción Personalizada</h1>
                <p class="text-xs text-indigo-300 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Asistente creativo en línea
                </p>
            </div>
        </div>
        <a href="admin.html" class="text-xs bg-indigo-900/80 hover:bg-indigo-900 text-indigo-200 hover:text-white px-3.5 py-2 rounded-xl border border-indigo-800 transition">Panel Admin</a>
    </header>

    <!-- Contenedor del Chat con más espacio y respiro -->
    <main id="chat-container" class="flex-1 overflow-y-auto px-4 md:px-6 py-6 max-w-2xl w-full mx-auto space-y-4 pb-28">
        <!-- Los mensajes se inyectan aquí -->
    </main>

    <!-- Campo de texto flotante, amplio y muy visible -->
    <footer id="chat-footer" class="absolute bottom-4 left-0 right-0 px-4 z-20">
        <div class="max-w-2xl w-full mx-auto">
            <form id="chat-form" class="flex items-center gap-3 bg-white border-2 border-indigo-500/40 rounded-2xl px-4 py-3.5 shadow-xl shadow-indigo-950/5 focus-within:border-indigo-600 focus-within:ring-4 focus-within:ring-indigo-600/10 transition-all">
                <input type="text" id="user-input" placeholder="💬 Escribe aquí tu respuesta o cuéntame tu idea..." class="flex-1 bg-transparent border-none text-slate-800 placeholder-slate-400 text-sm md:text-base focus:outline-none" autocomplete="off" required>
                <button type="submit" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-semibold text-sm hover:bg-indigo-700 transition shadow-md flex items-center gap-1.5 cursor-pointer">
                    <span>Enviar</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </button>
            </form>
        </div>
    </footer>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatFooter = document.getElementById('chat-footer');

        const JSONBIN_INDICE_ID = "6aab0edbac6210605ad634db"; 
        let currentBinId = null; 

        const G_API_KEY = "AQ.Ab8RN6LNp2U7oJDbGzaadSAMkqBZBjjXUP-mj8OWTDNVpo3Jcw";
        const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${G_API_KEY}`;

        let sessionState = {
            appTag: "TortillasAGranelCanciones",
            sessionId: 'sesion_' + Date.now(),
            timestamp: new Date().toISOString(),
            status: 'Activo',
            nombreCliente: '',
            telefono: '',
            estiloMusical: '',
            letraFinal: '',
            historialConversacion: []
        };

        let faseActual = 'INICIO';

        const SYSTEM_PROMPT = `Eres el asistente virtual experto, cálido y empático de un servicio de canciones personalizadas. 
REGLA DE FORMATO ESTRICTA: NUNCA uses asteriscos dobles (**) para negritas. Utiliza siempre etiquetas HTML puras como <b>texto</b> para resaltar y <br> para saltos de línea.

Sigue estrictamente este orden conversacional:
1. Saludo inicial: Saluda amablemente y pregunta si la canción es para alguna ocasión especial o un proyecto propio.
2. Dinámica obligatoria: Tras su respuesta, preséntale la información de los 3 pasos, la inversión de ¢9,900 colones y la garantía de riesgo cero. Luego pregunta: ¿Tienes un texto completo para la canción o prefieres que armemos la letra juntos a partir de las ideas e historia que nos cuentes?
3. Manejo de la letra o ideas: Si da ideas o cuenta su historia, agradécele reconociendo el detalle y pregúntale si desea agregar algo más.
4. Armado y revisión de letra: Cuando indique que terminó, preséntale una propuesta formal estructurada con etiquetas <b>[Verso 1]</b>, <b>[Coro]</b>, etc., y pregúntale si está satisfecho o desea cambios hasta que la apruebe.
5. Estilo musical: Una vez aprobada la letra, pregúntale por el ritmo usando exactamente esta indicación: "por ejemplo cumbia, merengue, rock, pop, religiosa, etc., el que gustes".
6. Cierre y Datos: Pídele amablemente su <b>nombre</b> y su número de <b>teléfono</b>. Cuando te los proporcione, emite tu mensaje de agradecimiento y confirmación de que se le enviará la muestra.`;

        let geminiHistory = [];

        async function llamarBackend(action, binId = null, data = null, binName = null) {
            try {
                const response = await fetch('/.netlify/functions/api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action, binId, data, binName })
                });
                return await response.json();
            } catch (e) {
                console.error("Error en comunicación segura:", e);
                return null;
            }
        }

        function appendMessage(sender, htmlText) {
            const div = document.createElement('div');
            div.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'} animate-fade-in`;
            
            const isUser = sender === 'user';
            div.innerHTML = `
                <div class="max-w-md md:max-w-lg rounded-3xl px-5 py-4 text-sm md:text-base leading-relaxed shadow-md ${
                    isUser 
                    ? 'bg-indigo-600 text-white rounded-br-sm shadow-indigo-600/10' 
                    : 'bg-white text-slate-800 rounded-bl-sm border border-slate-200 shadow-slate-200/50'
                }">
                    ${htmlText}
                </div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            sessionState.historialConversacion.push({ remitente: sender, mensaje: htmlText });
            sincronizarConJSONBin();
        }

        function mostrarOpcionesRapidas(opciones) {
            const div = document.createElement('div');
            div.id = "quick-replies";
            div.className = "flex flex-wrap gap-2.5 my-3 justify-start animate-fade-in pl-1";
            
            opciones.forEach(opcion => {
                const btn = document.createElement('button');
                btn.type = "button";
                btn.className = "bg-indigo-50 text-indigo-700 border border-indigo-200 text-xs md:text-sm px-4 py-2.5 rounded-2xl hover:bg-indigo-600 hover:text-white transition font-medium shadow-sm cursor-pointer";
                btn.innerText = opcion;
                btn.onclick = () => {
                    const quickDiv = document.getElementById('quick-replies');
                    if (quickDiv) quickDiv.remove();

                    if (opcion.includes("Otro")) {
                        userInput.focus();
                        return;
                    }

                    userInput.value = opcion.replace(/^[🎂❤️🎸💬]\s*/, '');
                    chatForm.dispatchEvent(new Event('submit'));
                };
                div.appendChild(btn);
            });
            
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function crearBinIndependienteYActualizarIndice() {
            try {
                const resCreate = await llamarBackend('create', null, sessionState, sessionState.sessionId);
                if (resCreate && resCreate.metadata && resCreate.metadata.id) {
                    currentBinId = resCreate.metadata.id;

                    const resIndiceGet = await llamarBackend('get', JSONBIN_INDICE_ID);
                    let listaSessiones = resIndiceGet.record?.sessiones || [];
                    
                    if (!listaSessiones.includes(currentBinId)) {
                        listaSessiones.push(currentBinId);
                        await llamarBackend('update', JSONBIN_INDICE_ID, { sessiones: listaSessiones });
                    }
                }
            } catch (e) {
                console.error("Error registrando la sesión:", e);
            }
        }

        async function sincronizarConJSONBin() {
            if (!currentBinId) return;
            await llamarBackend('update', currentBinId, sessionState);
        }

        async function extraerDatosEstructuradosYFinalizar() {
            const promptExtraccion = `Analiza detalladamente todo el historial de esta conversación y extrae estrictamente en formato JSON plano (sin bloques de código markdown, solo el objeto JSON) las siguientes 4 variables:
{
  "nombreCliente": "el nombre del cliente mencionado",
  "telefono": "el número de teléfono proporcionado",
  "estiloMusical": "el estilo musical elegido",
  "letraFinal": "la letra completa aprobada"
}

Historial:
${JSON.stringify(sessionState.historialConversacion)}`;

            try {
                const response = await fetch(GEMINI_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: promptExtraccion }] }]
                    })
                });
                const data = await response.json();
                if (data.candidates && data.candidates[0].content) {
                    let textoRespuesta = data.candidates[0].content.parts[0].text;
                    textoRespuesta = textoRespuesta.replace(/```json/g, '').replace(/```/g, '').trim();
                    const datosExtraidos = JSON.parse(textoRespuesta);
                    
                    sessionState.nombreCliente = datosExtraidos.nombreCliente || sessionState.nombreCliente;
                    sessionState.telefono = datosExtraidos.telefono || sessionState.telefono;
                    sessionState.estiloMusical = datosExtraidos.estiloMusical || sessionState.estiloMusical;
                    sessionState.letraFinal = datosExtraidos.letraFinal || sessionState.letraFinal;
                    sessionState.status = "Completado";
                    
                    await sincronizarConJSONBin();
                }
            } catch (e) {
                console.error("Error extrayendo datos con IA:", e);
            }
        }

        window.addEventListener('load', async () => {
            const saludoInicial = "¡Hola! 👋🎵<br><br>Bienvenido a nuestro espacio de canciones personalizadas. Para ayudarte mejor, ¿la canción es para alguna ocasión especial o es un proyecto propio?";
            appendMessage('bot', saludoInicial);
            
            mostrarOpcionesRapidas([
                "🎂 Es para un cumpleaños",
                "❤️ Es un regalo de aniversario",
                "🎸 Es un proyecto musical",
                "💬 Otro (escribir mi caso)"
            ]);

            geminiHistory.push({
                role: "user",
                parts: [{ text: "Instrucción del Sistema: " + SYSTEM_PROMPT + "\n\nInicia la conversación saludando al usuario." }]
            });
            geminiHistory.push({
                role: "model",
                parts: [{ text: saludoInicial }]
            });
        });

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (faseActual === 'FINALIZADO') return;

            const text = userInput.value.trim();
            if (!text) return;

            const quickDiv = document.getElementById('quick-replies');
            if (quickDiv) quickDiv.remove();

            if (!currentBinId) {
                await crearBinIndependienteYActualizarIndice();
            }

            appendMessage('user', text);
            userInput.value = '';

            geminiHistory.push({
                role: "user",
                parts: [{ text: text }]
            });

            const esPasoContacto = text.length >= 5 && /\d/.test(text) && (text.includes(' ') || text.includes(','));

            if (esPasoContacto) {
                faseActual = 'FINALIZADO';
            }

            await enviarAGemini(esPasoContacto);
        });

        async function enviarAGemini(esCierre) {
            const typingId = 'typing-' + Date.now();
            const typingDiv = document.createElement('div');
            typingDiv.id = typingId;
            typingDiv.className = "flex justify-start animate-fade-in";
            typingDiv.innerHTML = `<div class="bg-white border border-slate-200 text-slate-400 rounded-2xl px-4 py-3 text-xs italic shadow-sm">El asistente está escribiendo...</div>`;
            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(GEMINI_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: geminiHistory })
                });

                const data = await response.json();
                document.getElementById(typingId).remove();

                if (data.candidates && data.candidates[0].content) {
                    let respuestaTexto = data.candidates[0].content.parts[0].text;
                    respuestaTexto = respuestaTexto.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
                    respuestaTexto = respuestaTexto.replace(/\n/g, '<br>');
                    
                    appendMessage('bot', respuestaTexto);
                    
                    geminiHistory.push({
                        role: "model",
                        parts: [{ text: respuestaTexto }]
                    });

                    if (esCierre || faseActual === 'FINALIZADO') {
                        faseActual = 'FINALIZADO';
                        await extraerDatosEstructuradosYFinalizar();
                        
                        document.querySelector('footer').innerHTML = `<div class="max-w-2xl w-full mx-auto bg-emerald-50 border-2 border-emerald-500/50 rounded-2xl p-4 text-center text-xs md:text-sm text-emerald-700 font-semibold shadow-xl">✅ Solicitud enviada correctamente. ¡Muchas gracias! Nos pondremos en contacto pronto.</div>`;
                        setTimeout(() => {
                            alert("¡Solicitud enviada con éxito! Nos pondremos en contacto contigo pronto.");
                        }, 400);
                    }

                } else {
                    appendMessage('bot', 'Disculpa, ocurrió un pequeño error procesando tu mensaje. ¿Podrías repetirlo?');
                }
            } catch (error) {
                document.getElementById(typingId).remove();
                console.error("Error conectando con Gemini API:", error);
                appendMessage('bot', '¡Entendido! Continuemos con tu canción. ¿Qué más te gustaría agregar?');
            }
        }
    </script>
</body>
</html>
