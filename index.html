<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea tu Canción Personalizada</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 h-screen flex flex-col justify-between">
    <header class="bg-indigo-900 text-white p-3 flex justify-between items-center shadow-md">
        <h1 class="text-lg font-bold">🎶 Tu Canción Personalizada</h1>
        <a href="admin.html" class="text-xs text-indigo-200 hover:text-white underline">Panel Admin</a>
    </header>

    <main id="chat-container" class="flex-1 overflow-y-auto p-4 max-w-xl w-full mx-auto space-y-3">
        <!-- Los mensajes se inyectan aquí -->
    </main>

    <footer id="chat-footer" class="bg-white border-t p-3 max-w-xl w-full mx-auto">
        <form id="chat-form" class="flex gap-2">
            <input type="text" id="user-input" placeholder="Escribe aquí..." class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" autocomplete="off" required>
            <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-semibold text-sm hover:bg-indigo-700 transition">Enviar</button>
        </form>
    </footer>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatFooter = document.getElementById('chat-footer');

        // Ya no se requiere la Master Key en el frontend; se gestiona de forma segura en Netlify Functions.
        const JSONBIN_INDICE_ID = "6aab0edbac6210605ad634db"; 
        let currentBinId = null; 

        // La API Key de Gemini se protege en Google Cloud restringiéndola por dominio (HTTP Referrer)
        const GEMINI_API_KEY = "__GEMINI_API_KEY__";
        const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}`;

        let sessionState = {
            appTag: "TortillasAGranelCanciones",
            sessionId: 'sesion_' + Date.now(),
            timestamp: new Date().toISOString(),
            status: 'Activo',
            nombreCliente: '',
            telefono: '',
            estiloMusical: '',
            letraFinal: '',
            historialConversacion: []
        };

        let faseActual = 'INICIO';

        const SYSTEM_PROMPT = `Eres el asistente virtual experto, cálido y empático de un servicio de canciones personalizadas. 
REGLA DE FORMATO ESTRICTA: NUNCA uses asteriscos dobles (**) para negritas. Utiliza siempre etiquetas HTML puras como <b>texto</b> para resaltar y <br> para saltos de línea.

Sigue estrictamente este orden conversacional:
1. Saludo inicial: Saluda amablemente y pregunta si la canción es para alguna ocasión especial o un proyecto propio.
2. Dinámica obligatoria: Tras su respuesta, preséntale la información de los 3 pasos, la inversión de ¢9,900 colones y la garantía de riesgo cero. Luego pregunta: ¿Tienes un texto completo para la canción o prefieres que armemos la letra juntos a partir de las ideas e historia que nos cuentes?
3. Manejo de la letra o ideas: Si da ideas o cuenta su historia, agradécele reconociendo el detalle y pregúntale si desea agregar algo más.
4. Armado y revisión de letra: Cuando indique que terminó, preséntale una propuesta formal estructurada con etiquetas <b>[Verso 1]</b>, <b>[Coro]</b>, etc., y pregúntale si está satisfecho o desea cambios hasta que la apruebe.
5. Estilo musical: Una vez aprobada la letra, pregúntale por el ritmo usando exactamente esta indicación: "por ejemplo cumbia, merengue, rock, pop, religiosa, etc., el que gustes".
6. Cierre y Datos: Pídele amablemente su <b>nombre</b> y su número de <b>teléfono</b>. Cuando te los proporcione, emite tu mensaje de agradecimiento y confirmación de que se le enviará la muestra.`;

        let geminiHistory = [];

        // Función puente segura hacia Netlify Functions
        async function llamarBackend(action, binId = null, data = null, binName = null) {
            try {
                const response = await fetch('/.netlify/functions/api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action, binId, data, binName })
                });
                return await response.json();
            } catch (e) {
                console.error("Error en comunicación segura:", e);
                return null;
            }
        }

        function appendMessage(sender, htmlText) {
            const div = document.createElement('div');
            div.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `<div class="max-w-xs md:max-w-sm rounded-2xl px-3.5 py-2 text-sm ${sender === 'user' ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-200 text-slate-800 rounded-bl-none'}">${htmlText}</div>`;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            sessionState.historialConversacion.push({ remitente: sender, mensaje: htmlText });
            sincronizarConJSONBin();
        }

        async function crearBinIndependienteYActualizarIndice() {
            try {
                // 1. Crear Bin exclusivo de sesión mediante la función segura
                const resCreate = await llamarBackend('create', null, sessionState, sessionState.sessionId);
                if (resCreate && resCreate.metadata && resCreate.metadata.id) {
                    currentBinId = resCreate.metadata.id;

                    // 2. Leer el índice central
                    const resIndiceGet = await llamarBackend('get', JSONBIN_INDICE_ID);
                    let listaSessiones = resIndiceGet.record?.sessiones || [];
                    
                    // 3. Actualizar el índice central de forma segura
                    if (!listaSessiones.includes(currentBinId)) {
                        listaSessiones.push(currentBinId);
                        await llamarBackend('update', JSONBIN_INDICE_ID, { sessiones: listaSessiones });
                    }
                }
            } catch (e) {
                console.error("Error registrando la sesión:", e);
            }
        }

        async function sincronizarConJSONBin() {
            if (!currentBinId) return;
            await llamarBackend('update', currentBinId, sessionState);
        }

        async function extraerDatosEstructuradosYFinalizar() {
            const promptExtraccion = `Analiza detalladamente todo el historial de esta conversación y extrae estrictamente en formato JSON plano (sin bloques de código markdown, solo el objeto JSON) las siguientes 4 variables:
{
  "nombreCliente": "el nombre del cliente mencionado",
  "telefono": "el número de teléfono proporcionado",
  "estiloMusical": "el estilo musical elegido",
  "letraFinal": "la letra completa aprobada"
}

Historial:
${JSON.stringify(sessionState.historialConversacion)}`;

            try {
                const response = await fetch(GEMINI_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: promptExtraccion }] }]
                    })
                });
                const data = await response.json();
                if (data.candidates && data.candidates[0].content) {
                    let textoRespuesta = data.candidates[0].content.parts[0].text;
                    textoRespuesta = textoRespuesta.replace(/```json/g, '').replace(/```/g, '').trim();
                    const datosExtraidos = JSON.parse(textoRespuesta);
                    
                    sessionState.nombreCliente = datosExtraidos.nombreCliente || sessionState.nombreCliente;
                    sessionState.telefono = datosExtraidos.telefono || sessionState.telefono;
                    sessionState.estiloMusical = datosExtraidos.estiloMusical || sessionState.estiloMusical;
                    sessionState.letraFinal = datosExtraidos.letraFinal || sessionState.letraFinal;
                    sessionState.status = "Completado";
                    
                    await sincronizarConJSONBin();
                }
            } catch (e) {
                console.error("Error extrayendo datos con IA:", e);
            }
        }

        window.addEventListener('load', async () => {
            await crearBinIndependienteYActualizarIndice();

            const saludoInicial = "¡Hola! 👋🎵<br><br>Para ayudarte mejor, ¿la canción es para alguna ocasión especial (un cumpleaños, aniversario, regalo) o es un proyecto propio?";
            appendMessage('bot', saludoInicial);
            
            geminiHistory.push({
                role: "user",
                parts: [{ text: "Instrucción del Sistema: " + SYSTEM_PROMPT + "\n\nInicia la conversación saludando al usuario." }]
            });
            geminiHistory.push({
                role: "model",
                parts: [{ text: saludoInicial }]
            });
        });

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (faseActual === 'FINALIZADO') return;

            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';

            geminiHistory.push({
                role: "user",
                parts: [{ text: text }]
            });

            const esPasoContacto = text.length >= 5 && /\d/.test(text) && (text.includes(' ') || text.includes(','));

            if (esPasoContacto) {
                faseActual = 'FINALIZADO';
            }

            await enviarAGemini(esPasoContacto);
        });

        async function enviarAGemini(esCierre) {
            const typingId = 'typing-' + Date.now();
            const typingDiv = document.createElement('div');
            typingDiv.id = typingId;
            typingDiv.className = "flex justify-start";
            typingDiv.innerHTML = `<div class="bg-slate-200 text-slate-500 rounded-2xl px-3.5 py-2 text-xs italic">Escribiendo...</div>`;
            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(GEMINI_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: geminiHistory })
                });

                const data = await response.json();
                document.getElementById(typingId).remove();

                if (data.candidates && data.candidates[0].content) {
                    let respuestaTexto = data.candidates[0].content.parts[0].text;
                    respuestaTexto = respuestaTexto.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
                    respuestaTexto = respuestaTexto.replace(/\n/g, '<br>');
                    
                    appendMessage('bot', respuestaTexto);
                    
                    geminiHistory.push({
                        role: "model",
                        parts: [{ text: respuestaTexto }]
                    });

                    if (esCierre || faseActual === 'FINALIZADO') {
                        faseActual = 'FINALIZADO';
                        await extraerDatosEstructuradosYFinalizar();
                        
                        chatFooter.innerHTML = `<div class="text-center text-xs text-emerald-700 font-bold py-2">✅ Solicitud enviada correctamente. ¡Muchas gracias!</div>`;
                        setTimeout(() => {
                            alert("¡Solicitud enviada con éxito! Nos pondremos en contacto contigo pronto.");
                        }, 400);
                    }

                } else {
                    appendMessage('bot', 'Disculpa, ocurrió un pequeño error procesando tu mensaje. ¿Podrías repetirlo?');
                }
            } catch (error) {
                document.getElementById(typingId).remove();
                console.error("Error conectando con Gemini API:", error);
                appendMessage('bot', '¡Entendido! Continuemos con tu canción. ¿Qué más te gustaría agregar?');
            }
        }
    </script>
</body>
</html>
