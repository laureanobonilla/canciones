<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Solicitudes</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-6">
    <div id="auth-screen" class="max-w-md mx-auto mt-20 bg-white shadow-lg rounded-xl p-6 text-center">
        <h2 class="text-xl font-bold text-slate-800 mb-4">🔐 Acceso Administrativo</h2>
        <input type="password" id="input-password" placeholder="Ingresa la contraseña" class="w-full border rounded-lg px-3 py-2 text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button onclick="verificarPassword()" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold text-sm hover:bg-indigo-700 transition">Entrar al Panel</button>
        <p id="error-msg" class="text-xs text-red-500 mt-2 hidden">Contraseña incorrecta.</p>
    </div>

    <div id="admin-panel" class="max-w-7xl mx-auto bg-white shadow-lg rounded-xl p-6 hidden">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">📊 Solicitudes y Sesiones de Canciones</h1>
            <div class="space-x-2">
                <button onclick="cargarDatos()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-semibold text-sm hover:bg-indigo-700 transition">🔄 Actualizar</button>
                <button onclick="exportarCSV()" class="bg-green-600 text-white px-4 py-2 rounded-lg font-semibold text-sm hover:bg-green-700 transition">📥 Exportar a CSV</button>
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-200 text-slate-700 text-xs uppercase">
                    <tr>
                        <th class="p-3">Fecha</th>
                        <th class="p-3">Estado</th>
                        <th class="p-3">Nombre</th>
                        <th class="p-3">Teléfono</th>
                        <th class="p-3">Estilo Musical</th>
                        <th class="p-3">Letra / Progreso</th>
                        <th class="p-3 text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-solicitudes" class="divide-y divide-slate-200 text-sm">
                    <tr>
                        <td colspan="7" class="p-4 text-center text-slate-500">Cargando registros...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const PASSWORD_ADMIN = "2026*Principios";
        // Credenciales inyectadas mediante variables de entorno en compilación
        const JSONBIN_MASTER_KEY = "__JSONBIN_MASTER_KEY__";
        const JSONBIN_INDICE_ID = "__JSONBIN_INDICE_ID__"; 

        let registrosGlobales = [];

        function verificarPassword() {
            const pass = document.getElementById('input-password').value;
            if (pass === PASSWORD_ADMIN) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('admin-panel').classList.remove('hidden');
                cargarDatos();
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        }

        async function cargarDatos() {
            const tbody = document.getElementById('tabla-solicitudes');
            tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-slate-500">Cargando registros desde la nube...</td></tr>`;

            try {
                const indiceRes = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_INDICE_ID}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
                });
                const indiceData = await indiceRes.json();
                const listaIds = indiceData.record?.sessiones || [];

                registrosGlobales = [];

                for (let binId of listaIds) {
                    try {
                        const binRes = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
                            headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
                        });
                        const binData = await binRes.json();
                        const record = binData.record;

                        if (record && record.appTag === "TortillasAGranelCanciones") {
                            registrosGlobales.push(record);
                        }
                    } catch (err) {
                        console.error(`Error leyendo sesión ${binId}:`, err);
                    }
                }

                tbody.innerHTML = '';
                if (registrosGlobales.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-slate-500">No hay registros todavía.</td></tr>`;
                    return;
                }

                registrosGlobales.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

                registrosGlobales.forEach((reg) => {
                    const esCompletado = reg.status === 'Completado' || (reg.telefono && reg.estiloMusical);
                    const tr = document.createElement('tr');
                    
                    let infoProgreso = 'Sin definir';
                    if (reg.letraFinal) {
                        infoProgreso = reg.letraFinal.replace(/<br>/g, ' ');
                    } else if (reg.historialConversacion && reg.historialConversacion.length > 0) {
                        const ultimoUser = reg.historialConversacion.slice().reverse().find(h => h.remitente === 'user');
                        infoProgreso = `[En curso] Último mensaje: "${ultimoUser ? ultimoUser.mensaje : '...'}"`;
                    }

                    tr.innerHTML = `
                        <td class="p-3">${reg.timestamp ? new Date(reg.timestamp).toLocaleDateString() + ' ' + new Date(reg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'N/D'}</td>
                        <td class="p-3 font-semibold ${esCompletado ? 'text-green-600' : 'text-amber-600'}">${esCompletado ? 'Completado' : 'En proceso'}</td>
                        <td class="p-3">${reg.nombreCliente || 'No indicado'}</td>
                        <td class="p-3">${reg.telefono || 'No indicado'}</td>
                        <td class="p-3">${reg.estiloMusical || 'No indicado'}</td>
                        <td class="p-3 truncate max-w-xs" title="${infoProgreso.replace(/"/g, '&quot;')}">${infoProgreso}</td>
                        <td class="p-3 text-center">
                            <button onclick='verConversacion(${JSON.stringify(reg.historialConversacion || [])})' class="bg-indigo-600 text-white px-3 py-1 rounded text-xs hover:bg-indigo-700 transition">💬 Ver Chat</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error("Error al cargar panel:", error);
                tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-red-500">Error al conectar con JSONBin. Verifica tu Master Key.</td></tr>`;
            }
        }

        function exportarCSV() {
            if (!registrosGlobales.length) {
                alert("No hay registros para exportar.");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,SessionID,Fecha,Estado,Nombre,Telefono,EstiloMusical,LetraFinal\n";

            registrosGlobales.forEach(reg => {
                let fila = [
                    reg.sessionId || '',
                    reg.timestamp || '',
                    reg.status || 'Activo',
                    `"${reg.nombreCliente || ''}"`,
                    `"${reg.telefono || ''}"`,
                    `"${reg.estiloMusical || ''}"`,
                    `"${(reg.letraFinal || '').replace(/<br>/g, ' ').replace(/"/g, '""')}"`
                ];
                csvContent += fila.join(",") + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "sesiones_canciones.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function verConversacion(historial) {
            let ventana = window.open("", "_blank", "width=550,height=700");
            ventana.document.write(`
                <html>
                <head><title>Historial de Conversación</title><script src="https://cdn.tailwindcss.com"><\/script></head>
                <body class="bg-slate-50 p-4 font-sans">
                    <h2 class="text-lg font-bold text-slate-800 mb-3 border-b pb-2">💬 Historial del Chat</h2>
                    <div class="space-y-2">
            `);
            
            if (historial && historial.length) {
                historial.forEach(h => {
                    const esUser = h.remitente === 'user';
                    ventana.document.write(`
                        <div class="flex ${esUser ? 'justify-end' : 'justify-start'}">
                            <div class="max-w-xs rounded-xl px-3 py-2 text-xs ${esUser ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-800'}">
                                <strong>${esUser ? 'Cliente' : 'Asistente'}:</strong><br>${h.mensaje}
                            </div>
                        </div>
                    `);
                });
            } else {
                ventana.document.write("<p class='text-sm text-slate-500'>No hay mensajes registrados.</p>");
            }

            ventana.document.write(`</div></body></html>`);
            ventana.document.close();
        }
    </script>
</body>
</html>
